<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a4fc4">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Sign In — F.A.S.P.A.S</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#03050d; --bg-1:#070d1e; --bg-2:#0d1730;
  --panel:#0f1c3a; --line:#1e3260; --line-bright:#2f4d8f;
  --flame:#2f8fff; --flame-2:#6fc6ff; --flame-3:#bfeaff; --flame-deep:#0a4fc4;
  --text:#eaf3ff; --muted:#7d92ba; --fail:#ff5470;
  --radius:18px; --radius-sm:12px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg-0); color:var(--text); font-family:'Exo 2',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px 16px;
}
.wrap{width:100%; max-width:380px;}
.hero-mark{
  width:76px; height:76px; border-radius:20px; margin:0 auto 16px;
  background:linear-gradient(155deg, var(--flame-deep) 0%, var(--flame) 55%, var(--flame-3) 100%);
  display:flex; align-items:center; justify-content:center;
  font-family:'Orbitron',sans-serif; font-weight:900; font-size:2.2rem; color:#03101f;
  box-shadow:0 0 40px rgba(47,143,255,0.5);
}
.title{
  font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.5rem; text-align:center;
  letter-spacing:1px; margin-bottom:6px;
}
.sub{ text-align:center; color:var(--muted); font-size:0.86rem; margin-bottom:26px; }

.card{
  background:linear-gradient(180deg, var(--panel), var(--bg-1));
  border:1px solid var(--line); border-radius:var(--radius); padding:22px 20px;
}

.google-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  background:#fff; color:#1f1f1f; border:none; border-radius:var(--radius-sm);
  padding:14px; font-family:'Exo 2',sans-serif; font-weight:600; font-size:0.95rem;
  cursor:pointer; transition:transform .12s ease;
}
.google-btn:active{ transform:scale(0.97); }
.google-btn svg{ width:20px; height:20px; }

.divider{ display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--muted); font-size:0.78rem; }
.divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--line); }

.field{
  width:100%; padding:14px; margin-bottom:12px;
  background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius-sm);
  color:var(--text); font-family:'Exo 2',sans-serif; font-size:0.94rem;
}
.field:focus{ outline:none; border-color:var(--flame); }
.field::placeholder{ color:var(--muted); }

.submit-btn{
  width:100%; padding:14px; margin-top:4px;
  background:linear-gradient(90deg, var(--flame-deep), var(--flame));
  border:none; border-radius:var(--radius-sm); color:#03101f;
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:0.92rem;
  cursor:pointer; transition:transform .12s ease;
}
.submit-btn:active{ transform:scale(0.97); }
.submit-btn:disabled{ opacity:0.5; }

.toggle-mode{
  text-align:center; margin-top:16px; font-size:0.86rem; color:var(--muted);
}
.toggle-mode a{ color:var(--flame-2); text-decoration:none; font-weight:600; cursor:pointer; }

.error-msg{
  display:none; background:rgba(255,84,112,0.12); border:1px solid var(--fail);
  color:var(--fail); font-size:0.82rem; padding:10px 12px; border-radius:10px;
  margin-bottom:14px;
}
.error-msg.show{ display:block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero-mark">F</div>
  <div class="title">F.A.S.P.A.S</div>
  <div class="sub" id="subText">Sign in to start practicing</div>

  <div class="card">
    <div class="error-msg" id="errorMsg"></div>

    <button class="google-btn" id="googleBtn" type="button">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.82-.07-1.6-.2-2.36H12v4.47h6.47c-.28 1.5-1.13 2.78-2.4 3.63v3.02h3.88c2.27-2.09 3.57-5.17 3.57-8.76z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.9l-3.88-3.02c-1.07.72-2.45 1.15-4.05 1.15-3.12 0-5.76-2.1-6.7-4.93H1.3v3.1C3.26 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.3 14.3c-.24-.72-.38-1.49-.38-2.3s.14-1.58.38-2.3V6.6H1.3A11.98 11.98 0 000 12c0 1.94.46 3.77 1.3 5.4l4-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.45-3.45C17.94 1.19 15.24 0 12 0 7.3 0 3.26 2.7 1.3 6.6l4 3.1C6.24 6.85 8.88 4.75 12 4.75z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <form id="emailForm">
      <input type="email" class="field" id="emailInput" placeholder="Email address" required autocomplete="email">
      <input type="password" class="field" id="passwordInput" placeholder="Password" required autocomplete="current-password" minlength="6">
      <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
    </form>

    <div class="toggle-mode">
      <span id="toggleText">Don't have an account?</span> <a id="toggleLink">Sign up</a>
    </div>
  </div>
</div>

<script type="module">
  import { auth } from './firebase-config.js';
  import {
    GoogleAuthProvider, signInWithRedirect, getRedirectResult,
    onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const errorMsg = document.getElementById('errorMsg');
  const googleBtn = document.getElementById('googleBtn');
  const emailForm = document.getElementById('emailForm');
  const submitBtn = document.getElementById('submitBtn');
  const toggleLink = document.getElementById('toggleLink');
  const toggleText = document.getElementById('toggleText');
  const subText = document.getElementById('subText');

  let isSignUp = false;

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
  }
  function clearError() {
    errorMsg.classList.remove('show');
  }
  function goToDestination() {
    const dest = sessionStorage.getItem('postLoginRedirect') || 'index.html';
    sessionStorage.removeItem('postLoginRedirect');
    window.location.href = dest;
  }
  function friendlyError(code) {
    const map = {
      'auth/invalid-email': 'That email address looks invalid.',
      'auth/user-not-found': 'No account found with that email.',
      'auth/wrong-password': 'Incorrect password.',
      'auth/invalid-credential': 'Incorrect email or password.',
      'auth/email-already-in-use': 'An account already exists with that email.',
      'auth/weak-password': 'Password should be at least 6 characters.',
      'auth/too-many-requests': 'Too many attempts. Try again shortly.'
    };
    return map[code] || 'Something went wrong. Please try again.';
  }

  // If already logged in, skip straight past this page
  onAuthStateChanged(auth, (user) => {
    if (user) goToDestination();
  });

  // Catch the result of a Google redirect sign-in
  getRedirectResult(auth).catch((err) => {
    showError(friendlyError(err.code));
  });

  googleBtn.addEventListener('click', () => {
    clearError();
    signInWithRedirect(auth, new GoogleAuthProvider());
  });

  toggleLink.addEventListener('click', () => {
    isSignUp = !isSignUp;
    clearError();
    if (isSignUp) {
      submitBtn.textContent = 'Create Account';
      toggleText.textContent = 'Already have an account?';
      toggleLink.textContent = 'Sign in';
      subText.textContent = 'Create an account to start practicing';
    } else {
      submitBtn.textContent = 'Sign In';
      toggleText.textContent = "Don't have an account?";
      toggleLink.textContent = 'Sign up';
      subText.textContent = 'Sign in to start practicing';
    }
  });

  emailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    submitBtn.disabled = true;
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    try {
      if (isSignUp) {
        await createUserWithEmailAndPassword(auth, email, password);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
      goToDestination();
    } catch (err) {
      showError(friendlyError(err.code));
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
