<style>
/* ============================================================
   F.A.S.P.A.S — BLUE FLAME THEME (v2)
   Shared stylesheet for all pages.
   ============================================================ */

:root{
  --bg-0:#03050d;
  --bg-1:#070d1e;
  --bg-2:#0d1730;
  --panel:#0f1c3a;
  --line:#1e3260;
  --line-bright:#2f4d8f;
  --flame:#2f8fff;
  --flame-2:#6fc6ff;
  --flame-3:#bfeaff;
  --flame-deep:#0a4fc4;
  --ice:#8fd9ff;
  --text:#eaf3ff;
  --muted:#7d92ba;
  --pass:#3ddc84;
  --fail:#ff5470;
  --warn:#ffb84d;
  --radius:18px;
  --radius-sm:12px;
}

*{box-sizing:border-box; margin:0; padding:0;}
::selection{ background:var(--flame); color:#04101f; }

html{ scroll-behavior:smooth; }

body{
  background:var(--bg-0);
  color:var(--text);
  font-family:'Exo 2', sans-serif;
  min-height:100vh;
  padding:22px 16px 70px;
  position:relative;
  overflow-x:hidden;
}

/* ---------- Ambient animated background: slow aurora wash ---------- */
body::before{
  content:"";
  position:fixed; inset:-10%;
  background:
    radial-gradient(circle at 20% -10%, rgba(47,143,255,0.20), transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(111,198,255,0.12), transparent 40%),
    radial-gradient(circle at 30% 110%, rgba(10,79,196,0.18), transparent 45%);
  animation:aurora-drift 18s ease-in-out infinite alternate;
  z-index:-2; pointer-events:none;
}
@keyframes aurora-drift{
  0%{ transform:translate(0,0) scale(1); }
  100%{ transform:translate(-2%,2%) scale(1.06); }
}

@media (prefers-reduced-motion: reduce){
  body::before, .brand-mark, .fullcbt-cta, .pulse-ring, .hero-title{ animation:none !important; }
}

.wrap{max-width:680px; margin:0 auto; position:relative; z-index:1;}

/* ---------- Hero (home only) ---------- */
.hero{ text-align:center; padding:18px 0 8px; position:relative; }
.hero-mark-wrap{
  position:relative; width:112px; height:112px; margin:0 auto 18px;
  display:flex; align-items:center; justify-content:center;
}
.pulse-ring{
  position:absolute; inset:0; border-radius:50%;
  border:2px solid var(--flame);
  animation:pulse-ring 2.6s ease-out infinite;
}
.pulse-ring.delay{ animation-delay:1.3s; }
@keyframes pulse-ring{
  0%{ transform:scale(0.7); opacity:0.9; }
  100%{ transform:scale(1.6); opacity:0; }
}
.hero-mark{
  width:88px; height:88px; border-radius:24px;
  background:linear-gradient(155deg, var(--flame-deep) 0%, var(--flame) 55%, var(--flame-3) 100%);
  display:flex; align-items:center; justify-content:center;
  font-family:'Orbitron', sans-serif; font-weight:900; font-size:2.6rem;
  color:#03101f;
  box-shadow:0 0 50px rgba(47,143,255,0.65), 0 0 100px rgba(47,143,255,0.25), inset 0 2px 0 rgba(255,255,255,0.4);
  position:relative; z-index:2;
}
.hero-title{
  font-family:'Orbitron', sans-serif; font-weight:900; font-size:2.1rem;
  letter-spacing:2px; margin-top:2px;
  background:linear-gradient(90deg, var(--flame-2), var(--flame-3), var(--ice));
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shine 6s linear infinite;
}
@keyframes shine{
  0%{ background-position:0% center; }
  100%{ background-position:200% center; }
}
.hero-sub{ color:var(--muted); font-size:0.92rem; margin-top:8px; line-height:1.6; max-width:420px; margin-left:auto; margin-right:auto; }

/* ---------- Countdown ---------- */
.countdown{ display:flex; justify-content:center; gap:10px; margin:22px 0 4px; }
.cd-unit{
  background:linear-gradient(180deg, var(--panel), var(--bg-1));
  border:1px solid var(--line-bright);
  border-radius:var(--radius-sm);
  padding:12px 8px; min-width:64px; text-align:center;
  box-shadow:0 0 20px rgba(47,143,255,0.12), inset 0 1px 0 rgba(255,255,255,0.04);
}
.cd-num{
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:1.4rem; color:var(--flame-3);
  text-shadow:0 0 16px rgba(111,198,255,0.6);
}
.cd-label{ font-size:0.66rem; color:var(--muted); letter-spacing:0.5px; margin-top:2px; text-transform:uppercase; }
.cd-note{ text-align:center; color:var(--muted); font-size:0.72rem; margin-top:8px; }

/* ---------- Brand row (subject/inner pages) ---------- */
.brand-row{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.brand-mark{
  width:48px; height:48px; border-radius:14px; flex-shrink:0;
  background:linear-gradient(155deg, var(--flame-deep), var(--flame) 60%, var(--flame-3));
  display:flex; align-items:center; justify-content:center;
  font-family:'Orbitron', sans-serif; font-weight:900; font-size:22px; color:#03101f;
  box-shadow:0 0 28px rgba(47,143,255,0.55), inset 0 1px 0 rgba(255,255,255,0.35);
}
.brand-name{
  font-family:'Orbitron', sans-serif; font-weight:700; font-size:1.5rem; letter-spacing:1.2px;
  background:linear-gradient(90deg, var(--flame-2), var(--ice));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.brand-sub{ color:var(--muted); font-size:0.86rem; margin-top:2px; }

/* ---------- Cards ---------- */
.card{
  background:linear-gradient(180deg, var(--panel), var(--bg-1));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px 18px;
  margin-bottom:16px;
  box-shadow:0 0 30px rgba(47,143,255,0.06), inset 0 1px 0 rgba(255,255,255,0.02);
}
.card h2{
  font-family:'Orbitron', sans-serif; font-size:1.05rem; color:var(--flame-2);
  margin-bottom:14px; letter-spacing:0.5px;
}

/* ---------- Subject grid ---------- */
.subject-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.subject-tile{
  background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:18px 14px; text-decoration:none; color:var(--text); display:block;
  position:relative; overflow:hidden;
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.subject-tile::after{
  content:""; position:absolute; inset:0; border-radius:inherit;
  background:radial-gradient(circle at 30% 20%, rgba(47,143,255,0.25), transparent 60%);
  opacity:0; transition:opacity .25s ease;
}
.subject-tile:active{ transform:scale(0.96); }
.subject-tile:hover{ border-color:var(--flame); box-shadow:0 8px 26px rgba(47,143,255,0.22); }
.subject-tile:hover::after{ opacity:1; }
.subject-tile .s-icon{ font-size:1.7rem; margin-bottom:8px; display:block; position:relative; z-index:1; }
.subject-tile .s-name{ font-family:'Orbitron',sans-serif; font-weight:700; font-size:0.96rem; position:relative; z-index:1; }
.subject-tile .s-count{ color:var(--muted); font-size:0.78rem; margin-top:4px; position:relative; z-index:1; }

.fullcbt-cta{
  display:block; text-decoration:none; position:relative; overflow:hidden;
  background:linear-gradient(120deg, var(--flame-deep), var(--flame) 45%, var(--flame-deep));
  background-size:220% 220%;
  animation:gradient-flow 6s ease infinite;
  border-radius:var(--radius); padding:22px; text-align:center; color:#03101f;
  box-shadow:0 10px 36px rgba(47,143,255,0.4);
  margin-bottom:16px;
  transition:transform .15s ease;
}
.fullcbt-cta:active{ transform:scale(0.98); }
@keyframes gradient-flow{
  0%{ background-position:0% 50%; }
  50%{ background-position:100% 50%; }
  100%{ background-position:0% 50%; }
}
.fullcbt-cta .fc-title{ font-family:'Orbitron',sans-serif; font-weight:900; font-size:1.2rem; letter-spacing:1px; }
.fullcbt-cta .fc-sub{ font-size:0.83rem; opacity:0.85; margin-top:5px; font-weight:600; }

.history-link{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:15px 16px; text-decoration:none; color:var(--text); margin-bottom:16px;
  transition:border-color .15s ease, transform .1s ease;
}
.history-link:hover{ border-color:var(--flame); }
.history-link:active{ transform:scale(0.98); }
.history-link .h-label{ font-weight:600; font-size:0.95rem; }
.history-link .h-arrow{ color:var(--flame-2); transition:transform .15s ease; display:inline-block; }
.history-link:hover .h-arrow{ transform:translateX(4px); }

/* ---------- Mode picker ---------- */
.mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.elective-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:10px; }
.elective-tile.locked{ opacity:0.4; pointer-events:none; }
.mode-tile{
  background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:16px 10px; text-align:center; cursor:pointer;
  transition:all .15s ease;
}
.mode-tile:active{ transform:scale(0.96); }
.mode-tile.selected{
  background:linear-gradient(180deg, var(--flame), var(--flame-deep));
  border-color:var(--flame); box-shadow:0 0 24px rgba(47,143,255,0.45);
}
.mode-tile .m-title{ font-family:'Orbitron',sans-serif; font-weight:700; font-size:0.92rem; }
.mode-tile .m-desc{ font-size:0.76rem; color:var(--muted); margin-top:4px; }
.mode-tile.selected .m-desc{ color:rgba(3,16,31,0.75); }
.mode-tile.selected .m-title{ color:#03101f; }

.select-field{
  width:100%; padding:14px; margin-bottom:14px;
  background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius-sm);
  color:var(--text); font-family:'Exo 2',sans-serif; font-size:0.94rem;
  transition:border-color .15s ease;
}
.select-field:focus{ outline:none; border-color:var(--flame); box-shadow:0 0 0 3px rgba(47,143,255,0.2); }

.toggle-row{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:13px 14px; margin-bottom:14px;
}
.toggle-row .t-label{ font-size:0.88rem; }
.toggle-row .t-note{ font-size:0.74rem; color:var(--muted); margin-top:2px; }
.switch{ position:relative; width:46px; height:26px; flex-shrink:0; margin-left:12px; }
.switch input{ opacity:0; width:0; height:0; }
.slider{ position:absolute; cursor:pointer; inset:0; background:var(--line); border-radius:20px; transition:.2s; }
.slider::before{ content:""; position:absolute; height:20px; width:20px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
.switch input:checked + .slider{ background:var(--flame); box-shadow:0 0 12px rgba(47,143,255,0.6); }
.switch input:checked + .slider::before{ transform:translateX(20px); }

.start-btn{
  width:100%; padding:16px; position:relative;
  background:linear-gradient(90deg, var(--flame-deep), var(--flame));
  border:none; border-radius:var(--radius-sm);
  color:#03101f; font-family:'Orbitron',sans-serif; font-weight:700; font-size:1.02rem; letter-spacing:0.5px;
  cursor:pointer; box-shadow:0 6px 22px rgba(47,143,255,0.35);
  transition:transform .12s ease, box-shadow .15s ease;
}
.start-btn:active{ transform:scale(0.97); box-shadow:0 3px 12px rgba(47,143,255,0.3); }
.start-btn:disabled{ opacity:0.45; box-shadow:none; }
.start-btn.ghost{ background:transparent; border:1px solid var(--flame); color:var(--flame-2); box-shadow:none; }
.start-btn.ghost:active{ background:rgba(47,143,255,0.1); }

/* ---------- Exam screen ---------- */
.exam-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:0.82rem; color:var(--muted); }
.timer-badge{
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:0.9rem;
  padding:6px 12px; border-radius:20px; background:var(--bg-2); border:1px solid var(--line);
  color:var(--flame-2); transition:all .3s ease;
}
.timer-badge.low{ color:var(--warn); border-color:var(--warn); }
.timer-badge.critical{ color:var(--fail); border-color:var(--fail); animation:pulse 0.9s infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.45;} }

.progress-bar{ height:6px; background:var(--bg-2); border-radius:4px; overflow:hidden; margin-bottom:16px; }
.progress-fill{ height:100%; background:linear-gradient(90deg,var(--flame),var(--flame-3)); width:0%; transition:width .3s ease; box-shadow:0 0 10px rgba(111,198,255,0.6); }

.q-tag{ display:inline-block; background:var(--bg-2); border:1px solid var(--line); color:var(--flame-2); font-size:0.7rem; padding:4px 10px; border-radius:20px; margin-bottom:10px; }
.q-text{ font-size:1.02rem; font-weight:600; line-height:1.5; margin-bottom:16px; }

.opt{
  display:block; width:100%; text-align:left;
  background:var(--bg-2); border:1px solid var(--line); border-radius:12px;
  padding:14px; margin-bottom:10px; color:var(--text); font-family:'Exo 2',sans-serif;
  font-size:0.94rem; cursor:pointer; transition:border-color .15s ease, transform .08s ease, background .15s ease;
}
.opt:not(.disabled):hover{ border-color:var(--flame-2); background:#101f42; }
.opt:not(.disabled):active{ transform:scale(0.985); }
.opt .opt-letter{ color:var(--flame-2); font-weight:700; margin-right:8px; }
.opt.correct{ background:linear-gradient(90deg,#0f3d24,#12522f); border-color:var(--pass); }
.opt.wrong{ background:linear-gradient(90deg,#3d0f1a,#521221); border-color:var(--fail); }
.opt.disabled{ pointer-events:none; opacity:0.9; }

.feedback{ display:none; margin-top:4px; padding:14px; border-radius:12px; background:var(--bg-2); border:1px solid var(--line); font-size:0.87rem; line-height:1.55; }
.feedback.show{ display:block; animation:fade-in .2s ease; }
@keyframes fade-in{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
.feedback .fb-label{ font-family:'Orbitron',sans-serif; font-size:0.78rem; letter-spacing:1px; margin-bottom:6px; }
.feedback.correct-fb .fb-label{ color:var(--pass); }
.feedback.wrong-fb .fb-label{ color:var(--fail); }

.nav-row{ display:flex; gap:10px; margin-top:14px; }
.nav-row .start-btn{ flex:1; }

/* ---------- Question navigator ---------- */
.qnav-toggle{
  position:fixed; right:16px; bottom:16px; z-index:50;
  width:56px; height:56px; border-radius:50%;
  background:linear-gradient(155deg, var(--flame), var(--flame-deep));
  color:#03101f; border:none; box-shadow:0 6px 24px rgba(47,143,255,0.55);
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:0.72rem;
  transition:transform .15s ease;
}
.qnav-toggle:active{ transform:scale(0.9); }
.qnav-panel{ position:fixed; inset:0; background:rgba(3,5,13,0.95); z-index:60; display:none; padding:20px 16px; overflow-y:auto; }
.qnav-panel.show{ display:block; animation:fade-in .15s ease; }
.qnav-panel h3{ font-family:'Orbitron',sans-serif; color:var(--flame-2); margin-bottom:14px; }
.qnav-grid{ display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; margin-bottom:16px; }
.qnav-cell{
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  background:var(--bg-2); border:1px solid var(--line); border-radius:6px;
  font-size:0.72rem; color:var(--muted); cursor:pointer; transition:transform .1s ease;
}
.qnav-cell:active{ transform:scale(0.85); }
.qnav-cell.unanswered{ background:rgba(255,84,112,0.18); border-color:var(--fail); color:var(--fail); }
.qnav-cell.answered{ background:rgba(61,220,132,0.18); border-color:var(--pass); color:var(--pass); }
.qnav-cell.flagged{ background:rgba(255,184,77,0.15); border-color:var(--warn); color:var(--warn); }
.qnav-cell.current{ background:#1f6fe0 !important; border-color:#7ec0ff !important; color:#fff !important; box-shadow:0 0 0 2px #7ec0ff; }
.qnav-legend{ display:flex; gap:14px; font-size:0.75rem; color:var(--muted); margin-bottom:14px; flex-wrap:wrap; }
.qnav-legend span{ display:flex; align-items:center; gap:5px; }
.qnav-legend .dot{ width:10px; height:10px; border-radius:3px; display:inline-block; }
.subject-block-label{ font-family:'Orbitron',sans-serif; font-size:0.75rem; color:var(--muted); margin:14px 0 6px; }

/* ---------- Review screen ---------- */
.review-item{ background:var(--bg-2); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
.review-item .r-q{ font-size:0.9rem; font-weight:600; margin-bottom:8px; }
.review-item .r-your{ font-size:0.84rem; margin-bottom:4px; }
.review-item .r-your.wrong{ color:var(--fail); }
.review-item .r-your.right{ color:var(--pass); }
.review-item .r-correct{ font-size:0.84rem; color:var(--pass); margin-bottom:8px; }
.review-item .r-exp{ font-size:0.82rem; color:var(--muted); line-height:1.5; }

/* ---------- Results ---------- */
.score-circle{
  width:154px; height:154px; border-radius:50%;
  border:7px solid var(--flame);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  margin:6px auto 20px; box-shadow:0 0 46px rgba(47,143,255,0.4), inset 0 0 20px rgba(47,143,255,0.15);
  animation:score-pop .4s ease;
}
@keyframes score-pop{ from{ transform:scale(0.7); opacity:0; } to{ transform:scale(1); opacity:1; } }
.score-num{ font-family:'Orbitron',sans-serif; font-size:2rem; font-weight:900; color:var(--flame-3); text-shadow:0 0 20px rgba(111,198,255,0.5); }
.score-label{ font-size:0.72rem; color:var(--muted); }
.subject-breakdown{ margin-top:6px; }
.sb-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:0.88rem; }
.sb-row:last-child{ border-bottom:none; }

/* ---------- History ---------- */
.hist-row{ background:var(--bg-2); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; transition:border-color .15s ease; }
.hist-row:hover{ border-color:var(--line-bright); }
.hist-row .hr-top{ display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:4px; }
.hist-row .hr-mode{ font-weight:700; color:var(--flame-2); }
.hist-row .hr-date{ color:var(--muted); font-size:0.76rem; }
.hist-row .hr-score{ font-family:'Orbitron',sans-serif; font-weight:700; font-size:1.1rem; }
.weak-tag{ display:inline-block; background:rgba(255,84,112,0.12); border:1px solid var(--fail); color:var(--fail); font-size:0.74rem; padding:3px 10px; border-radius:20px; margin:3px 4px 0 0; }
.strong-tag{ display:inline-block; background:rgba(61,220,132,0.12); border:1px solid var(--pass); color:var(--pass); font-size:0.74rem; padding:3px 10px; border-radius:20px; margin:3px 4px 0 0; }
.empty-note{ color:var(--muted); font-size:0.9rem; text-align:center; padding:20px 0; }

.back-link{ display:inline-block; color:var(--flame-2); text-decoration:none; font-size:0.88rem; margin-bottom:14px; transition:transform .12s ease; }
.back-link:active{ transform:translateX(-3px); }

.footer-note{ text-align:center; color:var(--muted); font-size:0.76rem; margin-top:18px; line-height:1.5; }

.hidden{ display:none !important; }

/* Accessible focus visibility across interactive elements */
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible{
  outline:2px solid var(--flame-2); outline-offset:2px;
}


/* ---------- Install app bar (PWA) ---------- */
.install-bar{
  position:fixed; left:12px; right:12px; bottom:12px; z-index:90;
  display:none; align-items:center; justify-content:space-between; gap:12px;
  background:linear-gradient(90deg, var(--flame-deep), var(--flame));
  border-radius:16px; padding:12px 14px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 8px 28px rgba(47,143,255,0.45);
  animation:install-slide-up .3s ease;
}
@keyframes install-slide-up{ from{ transform:translateY(20px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
.install-bar.show{ display:flex; }
.install-bar .ib-icon{
  width:34px; height:34px; border-radius:9px; background:#03101f; color:var(--flame-3);
  display:flex; align-items:center; justify-content:center; font-family:'Orbitron',sans-serif;
  font-weight:900; font-size:1rem; flex-shrink:0;
}
.install-bar .ib-text{ flex:1; min-width:0; }

<script src="faspas-bank.js"></script>
<script type="module">
import { checkFullCbtAccess, renderLockScreen } from './faspas-lock.js';
const $ = id => document.getElementById(id);
const B = window.FaspasBank;
const KEYS = Object.keys(B.SUBJECTS);
const LD = {};
let tab = 'weak';
let curSubj = null;
let P = null;
const TOPICS = {};

function jget(k,d){ try{ const x=localStorage.getItem(k); return x?JSON.parse(x):d; }catch(e){ return d; } }
function jset(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function show(n){
  ['home','subj','prac','res'].forEach(x=>$('screen-'+x).classList.toggle('hidden', x!==n));
  window.scrollTo(0,0);
  const ib=$('installBar'); if(ib) ib.style.display = (n==='prac') ? 'none' : '';
}
function pushView(v, extra){ try{ history.pushState(Object.assign({v:v}, extra||{}), ''); }catch(e){} }
function replaceView(v, extra){ try{ history.replaceState(Object.assign({v:v}, extra||{}), ''); }catch(e){} }

window.addEventListener('popstate', e => {
  const st = e.state || { v:'home' };
  if(st.v === 'subj' && st.k && LD[st.k]){ curSubj = st.k; renderSubj(); show('subj'); }
  else { curSubj = null; renderHome(); show('home'); }
});

async function loadAll(){
  await Promise.all(KEYS.map(async k => { try{ LD[k] = await B.load(k); TOPICS[k] = new Set(LD[k].bank.map(q => q.topic)); }catch(e){ LD[k] = null; } }));
}
function findQ(id){
  for(const k of KEYS){ const L = LD[k]; if(!L) continue; const q = L.bank.find(x=>x.id===id); if(q) return { q, k }; }
  return null;
}

/* ---- rendering (same rules as the subject pages) ---- */
function fillContent(q, k, els){
  const L = LD[k] || {};
  if(k==='chemistry') els.text.innerHTML = B.rich(q.q, L.imgs); else els.text.textContent = q.q;
  if(els.passage){
    if(q.p && L.passages && L.passages[q.p]){ els.passage.textContent = L.passages[q.p]; els.passage.classList.remove('hidden'); }
    else { els.passage.textContent=''; els.passage.classList.add('hidden'); }
  }
  if(els.img){
    els.img.innerHTML=''; let shown=false;
    if(q.img){ if(/^\s*</.test(q.img)) els.img.innerHTML=q.img; else { const im=new Image(); im.src=q.img; im.draggable=false; els.img.appendChild(im);} shown=true; }
    else if(q.diagramSrc){ const im=new Image(); im.src=q.diagramSrc; im.draggable=false; els.img.appendChild(im); shown=true; }
    els.img.classList.toggle('hidden', !shown);
  }
}

/* ---- data per subject ---- */
function weakTopics(k){
  const h = jget('faspas_history', []), agg = {};
  h.forEach(e => {
    let src;
    if(e.bySubject){ src = e.bySubject[k] || {}; }
    else { src = {}; const bd = e.breakdown || {}; Object.keys(bd).forEach(t => { if(TOPICS[k] && TOPICS[k].has(t)) src[t] = bd[t]; }); }
    Object.keys(src).forEach(t => { if(!agg[t]) agg[t] = { c:0, n:0 }; agg[t].c += src[t].correct; agg[t].n += src[t].total; });
  });
  return Object.keys(agg).filter(t => agg[t].n >= 3).map(t => ({ topic:t, pct:Math.round(agg[t].c/agg[t].n*100), n:agg[t].n }))
    .filter(x => x.pct < 60).sort((a,b)=>a.pct-b.pct);
}
function idsFor(store, k){
  const m = jget(store, {});
  return Object.keys(m).filter(id => { const f = findQ(id); return f && f.k === k; });
}

function renderHome(){
  const g = $('subjGrid'); g.innerHTML = '';
  KEYS.forEach(k => {
    if(!LD[k]) return;
    const w = weakTopics(k).length, x = idsFor('faspas_wrong', k).length, sv = idsFor('faspas_saved', k).length;
    const b = document.createElement('button'); b.className = 'rbtn' + (k==='english' ? ' all' : '');
    b.innerHTML = '<span class="rb-l" style="font-size:1rem;">' + esc(B.SUBJECTS[k].label) + '</span><span class="rb-l" style="font-weight:400; color:var(--muted); font-size:.74rem;">' + w + ' weak · ' + x + ' wrong · ' + sv + ' saved</span>';
    b.onclick = () => { curSubj = k; tab = 'weak'; pushView('subj', { k }); renderSubj(); show('subj'); };
    g.appendChild(b);
  });
}

function renderSubj(){
  const k = curSubj;
  $('subjTitle').textContent = B.SUBJECTS[k].label;
  document.querySelectorAll('#homeTabs .rtab').forEach(b => b.classList.toggle('active', b.dataset.t===tab));
  const body = $('homeBody');
  if(tab==='weak'){
    const w = weakTopics(k);
    if(!w.length){ body.innerHTML = '<div class="empty-note">No weak topics here yet. Do some practice or a Full CBT and the topics you struggle with will show up.</div>'; return; }
    body.innerHTML = '<p class="cd-note" style="text-align:left; margin-bottom:10px;">Topics under 60%. Tap one for a 10-question drill.</p>';
    w.forEach(x => {
      const d = document.createElement('button'); d.className = 'topic-row';
      d.innerHTML = '<span><b>' + esc(x.topic) + '</b></span><span class="weak-tag" style="margin:0;">' + x.pct + '%</span>';
      d.onclick = () => startTopic(k, x.topic);
      body.appendChild(d);
    });
  } else {
    const store = tab==='wrong' ? 'faspas_wrong' : 'faspas_saved';
    const items = idsFor(store, k);
    body.innerHTML = '<p class="cd-note" style="text-align:left; margin-bottom:10px;">' +
      (tab==='wrong' ? 'Questions you got wrong. Get one right here and it leaves this list.' : 'Questions you saved with ☆.') + '</p>' +
      '<div class="big-num">' + items.length + '</div><div class="cd-note" style="margin-bottom:12px;">' + (tab==='wrong' ? 'wrong answers waiting' : 'saved questions') + '</div>';
    if(items.length){
      const b = document.createElement('button'); b.className = 'start-btn';
      b.textContent = 'Practice ' + Math.min(10, items.length) + ' now';
      b.onclick = () => startIds(items, B.SUBJECTS[k].label + ' · ' + (tab==='wrong' ? 'wrong answers' : 'saved'));
      body.appendChild(b);
    }
  }
}

/* ---- practice ---- */
function startTopic(k, topic){
  const L = LD[k], seen = B.getSeen(k);
  const pool = L.bank.filter(q => q.topic === topic);
  const ranked = B.shuffle(pool).sort((a,b) => (seen[a.id]||0) - (seen[b.id]||0));
  const chosen = ranked.slice(0, 10);
  begin(chosen.map(q => ({ q, k })), 'Revise · ' + topic);
}
function startIds(ids, label){
  const pick = B.shuffle(ids).slice(0, 10).map(id => findQ(id));
  begin(pick, 'Revise · ' + label);
}
function begin(items, label){
  // balanced/mixed option order, per subject
  const out = [];
  const groups = {};
  items.forEach(it => { (groups[it.k] = groups[it.k] || []).push(it.q); });
  Object.keys(groups).forEach(k => B._arrange(groups[k].map(q=>[q]), LD[k]).forEach(q => out.push({ q, k })));
  P = { items: B.shuffle(out), i:0, correct:0, label, answered:false, topics:{}, bySub:{} };
  pushView('prac'); show('prac'); renderP();
}
function renderP(){
  const it = P.items[P.i], q = it.q, k = it.k, L = LD[k] || {};
  P.answered = false;
  $('pCounter').textContent = 'Q ' + (P.i+1) + '/' + P.items.length;
  $('pLabel').textContent = B.SUBJECTS[k].label;
  $('pFill').style.width = (P.i / P.items.length * 100) + '%';
  $('pTag').textContent = (q.topic || '') + (q.year ? ' • JAMB ' + q.year : '');
  fillContent(q, k, { text:$('pText'), passage:$('pPassage'), img:$('pImg') });
  const wrap = $('pOpts'); wrap.innerHTML = '';
  q.options.forEach((o,i) => {
    const b = document.createElement('button'); b.className = 'opt';
    b.innerHTML = '<span class="opt-letter">' + 'ABCD'[i] + '.</span>' + (k==='chemistry' ? B.rich(o, L.imgs, true) : o);
    b.onclick = () => answerP(i); wrap.appendChild(b);
  });
  $('pFb').className = 'feedback';
  $('pNext').classList.add('hidden');
  const s = jget('faspas_saved', {});
  $('pSave').textContent = s[q.id] ? '★ Saved' : '☆ Save question';
  $('pSave').classList.toggle('on', !!s[q.id]);
}
function answerP(i){
  if(P.answered) return; P.answered = true;
  const it = P.items[P.i], q = it.q, k = it.k, L = LD[k] || {};
  const ok = i === q.correct;
  if(ok) P.correct++;
  const t = q.topic || 'General';
  if(!P.topics[t]) P.topics[t] = { correct:0, total:0 };
  P.topics[t].total++; if(ok) P.topics[t].correct++;
  if(!P.bySub[k]) P.bySub[k] = {}; if(!P.bySub[k][t]) P.bySub[k][t] = { correct:0, total:0 };
  P.bySub[k][t].total++; if(ok) P.bySub[k][t].correct++;
  const btns = $('pOpts').children;
  for(let x=0;x<btns.length;x++){ btns[x].classList.add('disabled'); if(x===q.correct) btns[x].classList.add('correct'); else if(x===i) btns[x].classList.add('wrong'); }
  $('pFb').className = 'feedback show ' + (ok ? 'correct-fb' : 'wrong-fb');
  $('pFbLabel').textContent = ok ? 'CORRECT' : 'WRONG';
  const ex = q.explanation || 'No explanation provided yet for this question.';
  $('pFbExp').innerHTML = (k==='chemistry') ? B.rich(ex, L.imgs) : ex;
  // wrong bank upkeep
  const w = jget('faspas_wrong', {});
  if(ok){ if(w[q.id]) delete w[q.id]; }
  else { const e = w[q.id] || { subject:k, n:0 }; e.n++; e.last = Date.now(); e.subject = k; e.topic = t; w[q.id] = e; }
  jset('faspas_wrong', w);
  $('pNext').classList.remove('hidden');
  $('pNext').textContent = (P.i === P.items.length-1) ? 'Finish' : 'Next →';
}
function nextP(){
  if(P.i < P.items.length-1){ P.i++; renderP(); window.scrollTo(0,0); }
  else finishP();
}
function finishP(){
  const n = P.items.length;
  const h = jget('faspas_history', []);
  const subs = {}; P.items.forEach(it => subs[B.SUBJECTS[it.k].label] = 1);
  h.unshift({ kind:'revise', modeLabel:P.label, score:P.correct, total:n, breakdown:P.topics, bySubject:P.bySub, date:new Date().toISOString() });
  jset('faspas_history', h.slice(0,200));
  replaceView('res');
  $('rScore').textContent = P.correct + '/' + n;
  $('rNote').textContent = 'Saved to your History.';
  show('res');
}
function quitP(){
  if(P && Object.keys(P.topics).length){
    let tot = 0, cor = 0; Object.values(P.topics).forEach(v => { tot += v.total; cor += v.correct; });
    const h = jget('faspas_history', []);
    h.unshift({ kind:'revise', modeLabel:P.label + ' (stopped early)', score:cor, total:tot, breakdown:P.topics, bySubject:P.bySub, date:new Date().toISOString() });
    jset('faspas_history', h.slice(0,200));
  }
  P = null;
  history.back();
}

async function init(){
  replaceView('home');
  const access = await checkFullCbtAccess();
  if(access.blocked){ $('screen-home').innerHTML = ''; renderLockScreen($('screen-home'), access.reason); return; }
  await loadAll();
  if(!KEYS.some(k => LD[k])){ $('subjGrid').innerHTML = '<div class="empty-note" style="grid-column:1/-1;">Could not load the questions. Check your connection and refresh.</div>'; }
  else renderHome();
  document.querySelectorAll('#homeTabs .rtab').forEach(b => b.onclick = () => { tab = b.dataset.t; renderSubj(); });
  $('pNext').onclick = nextP;
  $('pQuit').onclick = quitP;
  $('rAgain').onclick = () => { P = null; history.back(); };
  $('pSave').onclick = () => {
    const q = P.items[P.i].q, s = jget('faspas_saved', {});
    if(s[q.id]) delete s[q.id]; else s[q.id] = { subject:P.items[P.i].k, topic:q.topic || 'General', t:Date.now() };
    jset('faspas_saved', s);
    $('pSave').textContent = s[q.id] ? '★ Saved' : '☆ Save question'; $('pSave').classList.toggle('on', !!s[q.id]);
  };
}
init();
</script>

  </div>

</div>


<script>
(function(){
  let deferredPrompt = null;
  let autoPromptOnceReady = false;
  const bar = document.getElementById('installBar');
  const btn = document.getElementById('installBtn');
  const subEl = document.getElementById('installSub');
  const titleEl = document.getElementById('installTitle');

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function isIOS(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW registration failed:', e));
  }

  if(!isStandalone()){
    // Show our own button immediately — don't wait around for Chrome's own timing/heuristics.
    bar.classList.add('show');
    if(isIOS()){
      titleEl.textContent = 'Add F.A.S.P.A.S to Home Screen';
      subEl.textContent = 'Tap Share, then "Add to Home Screen"';
      btn.textContent = 'How?';
    }
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if(!isStandalone()) bar.classList.add('show');
    if(autoPromptOnceReady){
      autoPromptOnceReady = false;
      triggerInstall();
    }
  });

  async function triggerInstall(){
    if(isIOS()){
      alert('On iPhone/iPad:\n1. Tap the Share icon in Safari\n2. Scroll down and tap "Add to Home Screen"\n3. Tap "Add"');
      return;
    }
    if(!deferredPrompt){
      // Chrome hasn't fired the event yet — queue the intent and let the user know.
      btn.textContent = 'Preparing…';
      autoPromptOnceReady = true;
      setTimeout(()=>{ if(btn.textContent==='Preparing…') btn.textContent = 'Install'; }, 6000);
      return;
    }
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if(choice && choice.outcome === 'accepted'){
      bar.classList.remove('show');
    }
  }

  btn.addEventListener('click', triggerInstall);

  window.addEventListener('appinstalled', () => {
    bar.classList.remove('show');
    deferredPrompt = null;
  });
})();
</script>

</body>
</html>
