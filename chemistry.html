<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F.A.S.P.A.S — Chemistry</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8MQXCOH4G8"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-8MQXCOH4G8');
</script>
<!-- GoatCounter -->
<script data-goatcounter="https://faspas-jamb.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">

  <a href="index.html" class="back-link">← Back to F.A.S.P.A.S</a>

  <div class="brand-row">
    <div class="brand-mark">F</div>
    <div>
      <div class="brand-name">Chemistry</div>
      <div class="brand-sub" id="qCountSub">Loading question bank…</div>
    </div>
  </div>

  <!-- ===================== PICK SCREEN ===================== -->
  <div id="screen-pick" class="card">
    <h2>Choose Your Mode</h2>
    <div class="mode-grid">
      <div class="mode-tile selected" data-mode="topics">
        <div class="m-title">📚 Topics</div>
        <div class="m-desc">Practice one topic at a time</div>
      </div>
      <div class="mode-tile" data-mode="years">
        <div class="m-title">📅 Years</div>
        <div class="m-desc">Full past-year paper, timed</div>
      </div>
    </div>

    <select id="topicSelect" class="select-field"></select>
    <select id="yearSelect" class="select-field hidden"></select>

    <div class="toggle-row" id="timerToggleRow">
      <div>
        <div class="t-label">Timed practice (40s/question)</div>
        <div class="t-note">Off lets you take your time while learning a topic</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="timerToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <button class="start-btn" id="startBtn">START</button>
  </div>

  <!-- ===================== EXAM SCREEN ===================== -->
  <div id="screen-exam" class="card hidden">
    <div class="exam-top hidden" id="examTop">
      <span id="qCounter">Q 1/10</span>
      <span class="timer-badge hidden" id="timerBadge">⏱ 40s</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="q-tag" id="qTag"></div>
    <div class="q-text" id="qText"></div>
    <div id="optsWrap"></div>
    <div class="feedback" id="feedback">
      <div class="fb-label" id="fbLabel"></div>
      <div id="fbExp"></div>
    </div>
    <div class="nav-row">
      <button class="start-btn ghost hidden" id="prevBtn">← Previous</button>
      <button class="start-btn hidden" id="nextBtn">Next →</button>
    </div>
  </div>

  <!-- ===================== RESULTS SCREEN ===================== -->
  <div id="screen-results" class="card hidden">
    <h2>Session Complete</h2>
    <div class="score-circle">
      <div class="score-num" id="finalScore">0/0</div>
      <div class="score-label" id="finalPct">0%</div>
    </div>
    <div class="subject-breakdown" id="subjectBreakdown"></div>
    <button class="start-btn" style="margin-top:16px;" onclick="location.reload()">Practice Again</button>
    <a href="index.html" class="start-btn ghost" style="margin-top:10px; display:block; text-align:center; text-decoration:none;">Back to Home</a>
  </div>

</div>

<script src="chemistry-data.js"></script>
<script src="assets/faspas-engine.js"></script>
<script>
const SUBJECT_NAME = "Chemistry";

document.addEventListener('DOMContentLoaded', ()=>{
  const topics = [...new Set(SUBJECT_BANK.filter(q=>q.topic).map(q=>q.topic))];
  const years = [...new Set(SUBJECT_BANK.filter(q=>q.year).map(q=>q.year))].sort((a,b)=>b-a);

  document.getElementById('qCountSub').textContent = `${SUBJECT_BANK.length} questions · ${topics.length} topics · ${years.length} years`;

  const topicSelect = document.getElementById('topicSelect');
  topics.forEach(t=>{
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    topicSelect.appendChild(opt);
  });

  const yearSelect = document.getElementById('yearSelect');
  years.forEach(y=>{
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = `${y} Paper`;
    yearSelect.appendChild(opt);
  });

  let selectedMode = 'topics';
  document.querySelectorAll('.mode-tile').forEach(tile=>{
    tile.addEventListener('click', ()=>{
      document.querySelectorAll('.mode-tile').forEach(t=>t.classList.remove('selected'));
      tile.classList.add('selected');
      selectedMode = tile.dataset.mode;
      topicSelect.classList.toggle('hidden', selectedMode!=='topics');
      yearSelect.classList.toggle('hidden', selectedMode!=='years');
      document.getElementById('timerToggleRow').classList.toggle('hidden', selectedMode!=='topics');
    });
  });

  document.getElementById('startBtn').addEventListener('click', ()=>{
    if(selectedMode==='topics'){
      const timerOn = document.getElementById('timerToggle').checked;
      startTopicsMode(SUBJECT_NAME, SUBJECT_BANK, topicSelect.value, timerOn);
    } else {
      startYearsMode(SUBJECT_NAME, SUBJECT_BANK, yearSelect.value);
    }
  });

  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  document.getElementById('prevBtn').addEventListener('click', prevQuestion);
});
</script>
</body>
</html>
